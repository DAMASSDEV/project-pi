name: nutrify
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  http: ^1.2.2
  google_fonts: ^6.2.1
  shared_preferences: ^2.2.3
  camera: ^0.11.1
  image_picker: ^1.1.2


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/hero-bot.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/hero-bot.png"

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/icon/
